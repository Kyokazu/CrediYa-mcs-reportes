server:
  port: 8083
spring:
  application:
    name: "msc-reportes"
  devtools:
    add-properties: false
    restart:
      enabled: false

  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
jwt:
  secret: "${JWT_SECRET}"
aws:
  sqs:
    region: "${AWS_REGION}"
routes:
  paths:
    report: "/api/v1/reportes"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    endpoint:
    queueUrl: "${AWS_APPROVED_LOAN_RESPONSE_QUEUE_URL}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
